<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #driverMap { height: 200px; width: 100%; border-radius: 8px; margin-bottom: 15px; z-index: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Driver Dashboard</h2>
            <p><strong>Driver:</strong> Ahmed</p>
            <p><strong>Bus:</strong> BUS-01</p>
            <p><strong>Status:</strong> <span id="trackingStatus" style="color: red;">Stopped</span></p>
            <div id="driverMap"></div>
        </div>

        <div id="message" class="message"></div>

        <button id="startBtn" class="btn btn-success">Start Tracking</button>
        <button id="stopBtn" class="btn btn-danger" disabled>Stop Tracking</button>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const statusSpan = document.getElementById('trackingStatus');
        const messageDiv = document.getElementById('message');

        let watchId = null;
        let lastUpdateTime = 0;
        const BUS_ID = 'BUS01';

        // --- Driver Map Setup ---
        const map = L.map('driverMap').setView([24.8607, 67.0011], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const busIcon = L.divIcon({ html: '<div style="font-size: 24px;">🚌</div>', className: 'bus-icon', iconSize: [30, 30], iconAnchor: [15, 15] });
        let busMarker = L.marker([24.8607, 67.0011], { icon: busIcon }).addTo(map);

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'driver.html';
        });

        logoutBtn.addEventListener('click', () => {
            if (watchId !== null) stopTracking();
            signOut(auth).then(() => window.location.href = 'index.html');
        });

        startBtn.addEventListener('click', () => {
            if (!navigator.geolocation) return showMessage("GPS is not supported.", "error");
            showMessage("Requesting GPS permission...", "warning");
            
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const now = Date.now();
                    // Update map instantly for driver feedback
                    const newLatLng = [position.coords.latitude, position.coords.longitude];
                    busMarker.setLatLng(newLatLng);
                    map.panTo(newLatLng);

                    if (now - lastUpdateTime > 10000) { // Firebase update every 10s
                        sendLocationToFirebase(position);
                        lastUpdateTime = now;
                    }
                },
                (error) => {
                    let errorMsg = "GPS Error: ";
                    if (error.code === 1) errorMsg += "Permission Denied.";
                    else if (error.code === 2) errorMsg += "Position Unavailable.";
                    showMessage(errorMsg, "error");
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );

            statusSpan.textContent = "Tracking...";
            statusSpan.style.color = "green";
            startBtn.disabled = true;
            stopBtn.disabled = false;
            showMessage("Tracking started!", "success");
        });

        stopBtn.addEventListener('click', stopTracking);

        function stopTracking() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            const busRef = ref(db, `liveLocation/${BUS_ID}`);
            set(busRef, { isTracking: false, timestamp: Date.now() })
                .then(() => {
                    showMessage("Tracking stopped.", "warning");
                    statusSpan.textContent = "Stopped";
                    statusSpan.style.color = "red";
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }).catch(err => showMessage("Error: " + err.message, "error"));
        }

        function sendLocationToFirebase(position) {
            const busRef = ref(db, `liveLocation/${BUS_ID}`);
            set(busRef, {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                timestamp: Date.now(),
                isTracking: true
            }).then(() => console.log("Firebase updated")).catch(err => showMessage("Firebase Error: " + err.message, "error"));
        }

        function showMessage(msg, type) {
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
