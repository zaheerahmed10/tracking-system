<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #driverMap { height: 200px; width: 100%; border-radius: 8px; margin-bottom: 15px; z-index: 1; }
        .status-badge {
            display: inline-block; padding: 5px 10px; border-radius: 20px; 
            font-weight: bold; font-size: 14px; color: white;
        }
        .status-moving { background-color: #28a745; }
        .status-stopped { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Driver Dashboard</h2>
            <p><strong>Driver:</strong> Ahmed</p>
            <p><strong>Bus:</strong> BUS-01</p>
            <p><strong>Status:</strong> <span id="trackingStatus" class="status-badge status-stopped">Stopped</span></p>
            <p><strong>Movement:</strong> <span id="movementStatus" style="font-weight:bold; color: gray;">Waiting...</span></p>
            <div id="driverMap"></div>
        </div>

        <div id="message" class="message"></div>

        <button id="startBtn" class="btn btn-success">Start Tracking</button>
        <button id="stopBtn" class="btn btn-danger" disabled>Stop Tracking</button>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const trackingStatus = document.getElementById('trackingStatus');
        const movementStatus = document.getElementById('movementStatus');
        const messageDiv = document.getElementById('message');

        let watchId = null;
        let lastUpdateTime = 0;
        const BUS_ID = 'BUS01';

        // Driver Map Setup
        const map = L.map('driverMap').setView([30.3753, 69.3451], 5); // Default Pakistan view
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        const busIcon = L.divIcon({ html: '<div style="font-size: 24px;">🚌</div>', className: 'bus-icon', iconSize: [30, 30], iconAnchor: [15, 15] });
        let busMarker = L.marker([30.3753, 69.3451], { icon: busIcon }).addTo(map);
        
        let isFirstLoad = true;
        let previousLat = null;
        let previousLng = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = 'driver.html';
        });

        logoutBtn.addEventListener('click', () => {
            if (watchId !== null) stopTracking();
            signOut(auth).then(() => window.location.href = 'index.html');
        });

        startBtn.addEventListener('click', () => {
            if (!navigator.geolocation) return showMessage("GPS is not supported.", "error");
            showMessage("Requesting GPS permission...", "warning");
            
            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const now = Date.now();
                    
                    // Movement Detection
                    let isMoving = false;
                    if (previousLat !== null && previousLng !== null) {
                        if (Math.abs(position.coords.latitude - previousLat) > 0.0001 || Math.abs(position.coords.longitude - previousLng) > 0.0001) {
                            isMoving = true;
                        }
                    }
                    previousLat = position.coords.latitude;
                    previousLng = position.coords.longitude;

                    // Update UI
                    if (isMoving) {
                        movementStatus.textContent = "Moving 🟢";
                        movementStatus.style.color = "#28a745";
                    } else {
                        movementStatus.textContent = "Stopped 🔴";
                        movementStatus.style.color = "#dc3545";
                    }

                    // Update Map instantly
                    const newLatLng = [position.coords.latitude, position.coords.longitude];
                    busMarker.setLatLng(newLatLng);
                    
                    if (isFirstLoad) {
                        map.setView(newLatLng, 15); // Zoom to driver's actual location
                        isFirstLoad = false;
                    } else {
                        map.panTo(newLatLng);
                    }

                    // Send to Firebase every 10s
                    if (now - lastUpdateTime > 10000) {
                        sendLocationToFirebase(position);
                        lastUpdateTime = now;
                    }
                },
                (error) => {
                    let errorMsg = "GPS Error: ";
                    if (error.code === 1) errorMsg += "Permission Denied.";
                    else if (error.code === 2) errorMsg += "Position Unavailable.";
                    showMessage(errorMsg, "error");
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );

            trackingStatus.textContent = "Tracking...";
            trackingStatus.className = "status-badge status-moving";
            startBtn.disabled = true;
            stopBtn.disabled = false;
            showMessage("Tracking started!", "success");
        });

        stopBtn.addEventListener('click', stopTracking);

        function stopTracking() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            const busRef = ref(db, `liveLocation/${BUS_ID}`);
            set(busRef, { isTracking: false, timestamp: Date.now() })
                .then(() => {
                    showMessage("Tracking stopped.", "warning");
                    trackingStatus.textContent = "Stopped";
                    trackingStatus.className = "status-badge status-stopped";
                    movementStatus.textContent = "Stopped 🔴";
                    movementStatus.style.color = "#dc3545";
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                }).catch(err => showMessage("Error: " + err.message, "error"));
        }

        function sendLocationToFirebase(position) {
            const busRef = ref(db, `liveLocation/${BUS_ID}`);
            set(busRef, {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                timestamp: Date.now(),
                isTracking: true
            }).then(() => console.log("Firebase updated")).catch(err => showMessage("Firebase Error: " + err.message, "error"));
        }

        function showMessage(msg, type) {
            messageDiv.textContent = msg;
            messageDiv.className = `message ${type}`;
        }
    </script>
</body>
</html>
